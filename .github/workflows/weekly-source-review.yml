name: Weekly source review

on:
  schedule:
    - cron: "0 8 * * 1"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create review reminder when none is open
        run: |
          existing="$(gh issue list --state open --search '"Weekly dashboard source review" in:title' --json number --jq 'length')"
          if [ "$existing" -gt 0 ]; then
            echo "An open review reminder already exists."
            exit 0
          fi
          gh issue create \
            --title "Weekly dashboard source review" \
            --body "Review the latest automated exercise, safety, and conflict headlines. Confirm official sources before adding or changing curated incidents, fatality totals, exercise records, conflict assessments, or executive takeaways. Close this issue when the review is complete."
