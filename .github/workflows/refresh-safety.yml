name: Refresh safety reporting

on:
  schedule:
    # 15:43 UTC = 8:43 AM PDT / 7:43 AM PST.
    - cron: "43 15 * * *"
    # Weekly five-year historical backfill, Sunday morning Pacific time.
    - cron: "13 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-data-updates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Refresh safety reporting
        run: node automation/update-open-source-data.mjs --sections=safety

      - name: Backfill five years of public safety reporting
        if: github.event.schedule == '13 16 * * 0'
        env:
          SAFETY_TIMESPAN: "1825d"
        run: node automation/update-open-source-data.mjs --sections=safety

      - name: Publish refreshed data
        run: |
          if git diff --quiet -- data/live-headlines.json; then
            echo "No safety-source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-headlines.json
          git commit -m "data: refresh safety reporting"
          git push
